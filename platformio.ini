; PlatformIO Project Configuration File
;
; Headless ESP32-S3 HomeKit BBQ controller.
;
; HomeSpan requires Arduino-ESP32 core >= 3.3.0, which the upstream
; platformio espressif32 platform does not provide. The pinned pioarduino
; platform release below ships Arduino-ESP32 3.3.x.
;
; HomeSpan needs an app partition of at least 1.9 MB; the DevKitC-1 N8R8
; (8 MB flash) with the default_8MB partition table satisfies this.

[platformio]
default_envs = esp32s3

[env:esp32s3]
; pioarduino platform pinned to a release providing Arduino-ESP32 3.3.x
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.31/platform-espressif32.zip
framework = arduino
board = esp32-s3-devkitc-1
board_build.partitions = default_8MB.csv
board_upload.flash_size = 8MB
monitor_speed = 115200
build_flags =
    -std=gnu++17
    -Wall
build_unflags =
    -std=gnu++11
lib_deps =
    homespan/HomeSpan@~2.1.2
    h2zero/NimBLE-Arduino@~2.3.4
build_src_filter = +<*>
